schema_version: "1.0"
skill_version: "0.1.0"
cases:
  - id: "TRIGGER-001"
    should_trigger: true
    prompt: "Create the next deployable vertical slice for a new synthetic model-driven service-request solution."
    reason: "New solution and explicit vertical-slice build-brief request."

  - id: "TRIGGER-002"
    should_trigger: true
    prompt: "Continue our existing Dynamics 365 solution from the agreed position and define the next MVP increment without reopening settled decisions."
    reason: "Continuation requiring state reconstruction and an increment brief."

  - id: "TRIGGER-003"
    should_trigger: true
    prompt: "Turn these completed test findings into the next smallest Power Platform build brief."
    reason: "Iteration after testing with an explicit delivery-slice outcome."

  - id: "TRIGGER-004"
    should_trigger: true
    prompt: "Prepare a build-ready Power Platform slice with entry, validation, persistence, feedback, telemetry, evidence, deployment, and rollback."
    reason: "Explicit request for the skill's complete orchestration contract."

  - id: "NO-TRIGGER-001"
    should_trigger: false
    prompt: "Is this Copilot Studio feature generally available and how is it licensed today?"
    reason: "Pure current-feature verification belongs to the current-feature verifier."

  - id: "NO-TRIGGER-002"
    should_trigger: false
    prompt: "Review this solution architecture and list findings, but do not create a build brief."
    reason: "Review-only diagnosis is outside the implementation-brief outcome."

  - id: "NO-TRIGGER-003"
    should_trigger: false
    prompt: "Connect to Dataverse and fix a failing production record update."
    reason: "Tenant access and operational troubleshooting are prohibited."

  - id: "NO-TRIGGER-004"
    should_trigger: false
    prompt: "Explain what a model-driven app is."
    reason: "General product education does not require delivery orchestration."

  - id: "NO-TRIGGER-005"
    should_trigger: false
    prompt: "Implement the already approved and current build brief exactly as written."
    reason: "Direct implementation from an existing brief belongs to an authorised implementation workflow."
